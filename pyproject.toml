[project]
name = "orca-dubins"
version = "0.1.0"
description = "Kinodynamically-constrained ORCA + Dubins local collision avoidance for fixed-wing aircraft swarms (research prototype)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bkuangs" }]
keywords = [
    "orca",
    "dubins",
    "collision-avoidance",
    "fixed-wing",
    "swarm",
    "kinodynamic",
    "reciprocal-velocity-obstacles",
]

dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/bkuangs/orca-dubins"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_dubins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
